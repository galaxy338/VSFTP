name: Build mod_webdav for MIPS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install MIPS cross-toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mipsel-linux-gnu libxml2-dev libsqlite3-dev uuid-dev

      - name: Download lighttpd 1.4.26 source
        run: |
          wget -q https://download.lighttpd.net/lighttpd/releases-1.4.x/lighttpd-1.4.26.tar.bz2
          tar xjf lighttpd-1.4.26.tar.bz2

      - name: Patch and compile mod_webdav.so
        run: |
          SRC=lighttpd-1.4.26/src

          # Fix 1: remove the conflicting socklen_t typedef in base.h
          sed -i 's/typedef int socklen_t;//' $SRC/base.h

          # Fix 2: LIGHTTPD_VERSION_ID is in version.h - check its value
          grep LIGHTTPD_VERSION_ID $SRC/version.h || true
          cat $SRC/version.h

          mipsel-linux-gnu-gcc             -march=mips32r2 -mabi=32 -EL             -O2 -fPIC -shared             -nostartfiles             -I $SRC             -I /usr/include/libxml2             -Wl,--allow-shlib-undefined             -Wl,-soname,mod_webdav.so             -o mod_webdav.so             $SRC/mod_webdav.c             -lxml2 -lsqlite3 -luuid             2>&1

          file mod_webdav.so
          ls -la mod_webdav.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod_webdav_mipsel
          path: mod_webdav.so
          retention-days: 7
