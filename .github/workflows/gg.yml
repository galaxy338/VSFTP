
name: Build Samba for JCO4032 2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            python3-dev \
            python3-setuptools \
            python3-pyelftools \
            pkg-config \
            flex bison \
            libacl1-dev \
            libattr1-dev \
            libcap-dev \
            libgnutls28-dev \
            libreadline-dev \
            zlib1g-dev \
            libpopt-dev \
            qemu-user \
            file \
            patchelf

      - name: Cache MIPS toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mips-toolchain
          key: jco4032-mipsel-uclibc-2020-02-2

      - name: Download MIPS uClibc toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/mips-toolchain"
          cd "$RUNNER_TEMP/mips-toolchain"

          wget -q --show-progress \
            https://toolchains.bootlin.com/downloads/releases/toolchains/mips32el/tarballs/mips32el--uclibc--stable-2020.02-2.tar.bz2 \
            -O toolchain.tar.bz2

          tar -xjf toolchain.tar.bz2
          rm toolchain.tar.bz2
          
      - name: Locate compiler
        id: compiler
        run: |
          ROOT="$RUNNER_TEMP/mips-toolchain"

          CC=$(find "$ROOT" -type f \
            -name 'mipsel-buildroot-linux-uclibc-gcc' | head -1)

          if [ -z "$CC" ]; then
            echo "Compiler not found"
            find "$ROOT" -name '*gcc'
            exit 1
          fi

          PREFIX="${CC%gcc}"
          SYSROOT=$("$CC" -print-sysroot)

          echo "cc=$CC" >> "$GITHUB_OUTPUT"
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "sysroot=$SYSROOT" >> "$GITHUB_OUTPUT"

          echo "Compiler: $CC"
          echo "Sysroot: $SYSROOT"
          "$CC" -dumpmachine
          "$CC" -v

      - name: Download Samba source
        run: |
          wget -q \
            https://download.samba.org/pub/samba/stable/samba-4.19.8.tar.gz \
            -O samba.tar.gz

          tar -xzf samba.tar.gz

      - name: Configure Samba
        working-directory: samba-4.19.8
        env:
          CC: ${{ steps.compiler.outputs.cc }}
          CROSS_COMPILE: ${{ steps.compiler.outputs.prefix }}
          SYSROOT: ${{ steps.compiler.outputs.sysroot }}
        run: |
          export PATH="$(dirname "$CC"):$PATH"

          export CFLAGS="-Os -pipe -march=34kc -mabi=32 -EL"
          export LDFLAGS="--sysroot=$SYSROOT"

          qemu-mipsel --version

          ./configure \
            --cross-compile \
            --cross-execute="qemu-mipsel -L $SYSROOT" \
            --cross-answers=cross-answers.txt \
            --hostcc=gcc \
            --prefix=/flash2/samba \
            --without-ad-dc \
            --without-ads \
            --without-ldap \
            --without-krb5 \
            --without-pam \
            --without-acl-support \
            --without-json \
            --disable-cups \
            --bundled-libraries=ALL \
            --private-libraries=talloc,tevent,tdb,ldb,replace

      - name: Compile Samba
        working-directory: samba-4.19.8
        env:
          CC: ${{ steps.compiler.outputs.cc }}
        run: |
          export PATH="$(dirname "$CC"):$PATH"
          ./buildtools/bin/waf build --targets=smbd -j2

      - name: Package and inspect
        working-directory: samba-4.19.8
        run: |
          set -eux

          mkdir -p ../samba-jco4032/sbin
          mkdir -p ../samba-jco4032/etc

          SMB="$(find bin -type f -name smbd | head -1)"
          test -n "$SMB"

          cp "$SMB" ../samba-jco4032/sbin/smbd

          cat > ../samba-jco4032/etc/smb.conf <<'EOF'
          [global]
          workgroup = WORKGROUP
          server string = JCO4032 NAS
          security = user
          map to guest = never
          server min protocol = SMB2
          server max protocol = SMB3
          smb ports = 445
          passdb backend = tdbsam
          private dir = /flash2/samba/private
          state directory = /flash2/samba/state
          cache directory = /flash2/samba/cache
          lock directory = /flash2/samba/lock
          pid directory = /flash2/samba/run
          log file = /flash2/samba/log/%m.log
          load printers = no
          disable spoolss = yes

          [Crucial]
          path = /tmp/mnt/nas/sda2
          browseable = yes
          read only = no
          valid users = nasuser
          create mask = 0664
          directory mask = 0775
          EOF

          echo "===== Binary ====="
          file ../samba-jco4032/sbin/smbd

          echo "===== ELF interpreter ====="
          readelf -l ../samba-jco4032/sbin/smbd | grep interpreter || true

          echo "===== Shared libraries ====="
          readelf -d ../samba-jco4032/sbin/smbd | grep NEEDED || true

          echo "===== Toolchain libc ====="
          find "$SYSROOT" -name 'libc.so*' -o -name 'ld-uClibc.so*'

          tar -czf ../samba-jco4032.tar.gz ../samba-jco4032

          sha256sum ../samba-jco4032.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: samba-jco4032
          path: samba-jco4032.tar.gz
          retention-days: 14
