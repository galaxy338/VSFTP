
name: Build JF-Samba for JCO4032 MIPS32r2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Cross-compile Samba 4.19.8
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      SAMBA_VERSION: 4.19.8
      GMP_VERSION: 6.2.1
      NETTLE_VERSION: 3.6
      GNUTLS_VERSION: 3.6.16
      ZLIB_VERSION: 1.3.1
      PREFIX: /flash2/samba

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ make \
            wget curl tar xz-utils gzip \
            python3 python3-dev \
            perl pkg-config \
            qemu-user qemu-user-static \
            git bison flex \
            libacl1-dev libattr1-dev \
            libpopt-dev libtirpc-dev

      - name: Download MIPSLE toolchain
        run: |
          wget -O toolchain.tar.bz2 \
            https://toolchains.bootlin.com/downloads/releases/toolchains/mips32el/tarballs/mips32el--uclibc--stable-2020.02-2.tar.bz2

          mkdir toolchain
          tar -xf toolchain.tar.bz2 -C toolchain --strip-components=1
          rm toolchain.tar.bz2

      - name: Configure cross-compilation environment
        run: |
          TOOLCHAIN="$GITHUB_WORKSPACE/toolchain"
          CC="$TOOLCHAIN/bin/mipsel-buildroot-linux-uclibc-gcc"
          SYSROOT="$($CC -print-sysroot)"
          TARGET="$($CC -dumpmachine)"

          echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/bin/mipsel-buildroot-linux-uclibc-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/bin/mipsel-buildroot-linux-uclibc-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/bin/mipsel-buildroot-linux-uclibc-strip" >> "$GITHUB_ENV"

          echo "SYSROOT=$SYSROOT" >> "$GITHUB_ENV"
          echo "TARGET=$TARGET" >> "$GITHUB_ENV"

          echo "DEPS=$GITHUB_WORKSPACE/deps" >> "$GITHUB_ENV"

          echo "LD_LIBRARY_PATH=$TOOLCHAIN/lib:$TOOLCHAIN/lib64" >> "$GITHUB_ENV"

          echo "CFLAGS=-Os -pipe -march=1004kc -mabi=32 -EL -D_FILE_OFFSET_BITS=64 -D_LARGEFILE_SOURCE -D_LARGEFILE64_SOURCE" >> "$GITHUB_ENV"

          echo "CPPFLAGS=-D_FILE_OFFSET_BITS=64 -D_LARGEFILE_SOURCE -D_LARGEFILE64_SOURCE" >> "$GITHUB_ENV"

          mkdir -p deps

          "$CC" -v
          "$CC" -print-sysroot
          "$CC" -dumpmachine

      - name: Install zlib
        run: |
          wget https://zlib.net/fossils/zlib-${ZLIB_VERSION}.tar.gz
          tar -xzf zlib-${ZLIB_VERSION}.tar.gz

          cd zlib-${ZLIB_VERSION}

          CC="$CC" \
          AR="$AR" \
          RANLIB="$RANLIB" \
          CFLAGS="$CFLAGS" \
          ./configure --prefix="$DEPS" --static

          make -j2
          make install

      - name: Build GMP
        run: |
          wget https://gmplib.org/download/gmp/gmp-${GMP_VERSION}.tar.xz
          tar -xf gmp-${GMP_VERSION}.tar.xz

          cd gmp-${GMP_VERSION}

          ./configure \
            --host="$TARGET" \
            --prefix="$DEPS" \
            --enable-static \
            --disable-shared \
            --disable-assembly \
            --disable-cxx \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CFLAGS="$CFLAGS"

          make -j2
          make install

      - name: Build Nettle
        run: |
          wget https://ftp.gnu.org/gnu/nettle/nettle-${NETTLE_VERSION}.tar.gz
          tar -xzf nettle-${NETTLE_VERSION}.tar.gz

          cd nettle-${NETTLE_VERSION}

          CPPFLAGS="-I$DEPS/include" \
          LDFLAGS="-L$DEPS/lib" \
          ./configure \
            --host="$TARGET" \
            --prefix="$DEPS" \
            --enable-static \
            --disable-shared \
            --disable-assembler \
            --disable-openssl \
            --disable-documentation \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CFLAGS="$CFLAGS"

          make -j2
          make install

      - name: Build GnuTLS
        run: |
          wget https://www.gnupg.org/ftp/gcrypt/gnutls/v3.6/gnutls-${GNUTLS_VERSION}.tar.xz
          tar -xf gnutls-${GNUTLS_VERSION}.tar.xz

          cd gnutls-${GNUTLS_VERSION}

          export CPPFLAGS="-I$DEPS/include"
          export LDFLAGS="-L$DEPS/lib"

          export GMP_CFLAGS="-I$DEPS/include"
          export GMP_LIBS="-L$DEPS/lib -lgmp"

          export NETTLE_CFLAGS="-I$DEPS/include"
          export NETTLE_LIBS="-L$DEPS/lib -lnettle"

          export HOGWEED_CFLAGS="-I$DEPS/include"
          export HOGWEED_LIBS="-L$DEPS/lib -lhogweed -lnettle -lgmp"

          ./configure \
            --host="$TARGET" \
            --prefix="$DEPS" \
            --enable-static \
            --disable-shared \
            --disable-doc \
            --disable-tools \
            --disable-cxx \
            --disable-tests \
            --disable-full-test-suite \
            --disable-libdane \
            --without-p11-kit \
            --without-tpm \
            --with-included-unistring \
            --without-zlib \
            --without-idn \
            --without-libidn2 \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            CFLAGS="$CFLAGS"

          make -j2
          make install

      - name: Verify dependencies
        run: |
          find "$DEPS/lib" -maxdepth 2 -type f
          test -f "$DEPS/lib/libgnutls.a"
          test -f "$DEPS/lib/libnettle.a"
          test -f "$DEPS/lib/libhogweed.a"
          test -f "$DEPS/lib/libgmp.a"
          test -f "$DEPS/lib/libz.a"

      - name: Download Samba
        run: |
          wget https://download.samba.org/pub/samba/stable/samba-${SAMBA_VERSION}.tar.gz

          tar -xzf samba-${SAMBA_VERSION}.tar.gz

      - name: Configure Samba
        working-directory: samba-4.19.8
        run: |
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR=""

          export CPPFLAGS="-I$DEPS/include $CPPFLAGS"
          export LDFLAGS="-L$DEPS/lib -Wl,-rpath-link,$DEPS/lib --sysroot=$SYSROOT"

          export CFLAGS="$CFLAGS"

          cat > cross-answers.txt <<'EOF'
          Checking uname sysname type: "Linux"
          Checking uname machine type: "mips"
          Checking uname release type: "Linux"
          Checking uname version type: "Linux"
          EOF

          ./configure \
            --cross-compile \
            --cross-execute="qemu-mipsel -L $SYSROOT" \
            --cross-answers=cross-answers.txt \
            --hostcc=gcc \
            --prefix="$PREFIX" \
            --sysconfdir="$PREFIX/etc" \
            --localstatedir="$PREFIX/var" \
            --with-configdir="$PREFIX/etc" \
            --with-privatedir="$PREFIX/private" \
            --with-lockdir="$PREFIX/lock" \
            --with-statedir="$PREFIX/state" \
            --with-cachedir="$PREFIX/cache" \
            --with-piddir="$PREFIX/run" \
            --with-logfilebase="$PREFIX/log" \
            --with-modulesdir="$PREFIX/lib" \
            --with-privatelibdir="$PREFIX/lib/private" \
            --disable-python \
            --without-ad-dc \
            --without-ads \
            --without-ldap \
            --without-pam \
            --without-acl-support \
            --bundled-libraries=ALL

      - name: Build Samba
        working-directory: samba-4.19.8
        run: |
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"

          export CPPFLAGS="-I$DEPS/include $CPPFLAGS"
          export LDFLAGS="-L$DEPS/lib -Wl,-rpath-link,$DEPS/lib --sysroot=$SYSROOT"

          ./buildtools/bin/waf build \
            --targets=smbd/smbd,smbpasswd,testparm \
            --jobs=2

      - name: Install Samba
        working-directory: samba-4.19.8
        run: |
          export PKG_CONFIG_PATH="$DEPS/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig"

          mkdir -p "$GITHUB_WORKSPACE/stage"

          ./buildtools/bin/waf install \
            --destdir="$GITHUB_WORKSPACE/stage"

      - name: Prepare SMB configuration
        run: |
          BASE="stage/flash2/samba"

          mkdir -p "$BASE/etc"
          mkdir -p "$BASE/private"
          mkdir -p "$BASE/lock"
          mkdir -p "$BASE/state"
          mkdir -p "$BASE/cache"
          mkdir -p "$BASE/run"
          mkdir -p "$BASE/log"

          cat > "$BASE/etc/smb.conf" <<'EOF'
          [global]
             workgroup = WORKGROUP
             server string = JioFiber NAS
             server role = standalone server

             security = user
             passdb backend = tdbsam
             map to guest = Never

             server min protocol = SMB2_02
             server max protocol = SMB3

             smb ports = 445
             load printers = no
             disable spoolss = yes

             log file = /flash2/samba/log/log.%m
             max log size = 512

          [Crucial]
             path = /tmp/mnt/nas/sda2
             browseable = yes
             read only = no
             guest ok = no
             create mask = 0664
             directory mask = 0775
          EOF

      - name: Verify binaries
        run: |
          find stage/flash2/samba -type f -exec file {} \;

          "$STRIP" stage/flash2/samba/sbin/smbd || true

          readelf -h stage/flash2/samba/sbin/smbd
          readelf -l stage/flash2/samba/sbin/smbd

          mkdir -p release

          tar -czf release/JF-Samba-${SAMBA_VERSION}-JCO4032-MIPS32r2.tar.gz \
            -C stage flash2/samba

      - name: Generate release tag
        id: tag
        run: |
          TAG="samba-${SAMBA_VERSION}-$(date +%Y%m%d-%H%M%S)"
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/JF-Samba-${{ env.SAMBA_VERSION }}-JCO4032-MIPS32r2.tar.gz
          name: JF-Samba ${{ env.SAMBA_VERSION }} for JCO4032
          tag_name: ${{ steps.tag.outputs.tag_name }}
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
