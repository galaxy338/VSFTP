
name: Build vsftpd for JioFiber JCO4032

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ make \
            git wget cpio rsync bc file \
            unzip python3 perl \
            libncurses-dev

      - name: Download Buildroot
        run: |
          git clone --depth 1 \
            https://github.com/buildroot/buildroot.git buildroot

      - name: Select MIPS little-endian configuration
        working-directory: buildroot
        shell: bash
        run: |
          set -euo pipefail

          echo "Available MIPS configurations:"
          find configs -maxdepth 1 -type f \
            -iname '*mips*' -printf '%f\n' | sort

          CONFIG=""

          for candidate in \
            qemu_mips32r2el_malta_defconfig \
            qemu_mipsel_malta_defconfig \
            qemu_mips32el_malta_defconfig
          do
            if [ -f "configs/$candidate" ]; then
              CONFIG="$candidate"
              break
            fi
          done

          if [ -z "$CONFIG" ]; then
            echo "::error::No supported MIPS little-endian configuration found."
            exit 1
          fi

          echo "Using $CONFIG"
          make "$CONFIG"

      - name: Configure vsftpd
        working-directory: buildroot
        shell: bash
        run: |
          set -euo pipefail

          test -f package/vsftpd/vsftpd.mk || {
            echo "::error::Buildroot vsftpd package not found."
            exit 1
          }

          utils/config --file .config \
            --enable BR2_PACKAGE_VSFTPD

          utils/config --file .config \
            --enable BR2_TARGET_ROOTFS_TAR

          make olddefconfig

          if ! grep -qx 'BR2_PACKAGE_VSFTPD=y' .config; then
            echo "::error::vsftpd was not enabled."
            exit 1
          fi

          echo "=== Toolchain configuration ==="
          grep -E \
            '^(BR2_mips|BR2_MIPS|BR2_TOOLCHAIN_BUILDROOT|BR2_TOOLCHAIN_USES_GLIBC|BR2_TOOLCHAIN_USES_UCLIBC|BR2_STATIC_LIBS|BR2_SHARED_LIBS|BR2_PACKAGE_VSFTPD)=' \
            .config || true

      - name: Compile vsftpd
        working-directory: buildroot
        run: |
          set -euo pipefail
          make -j"$(nproc)"

      - name: Package binary and diagnostics
        working-directory: buildroot
        shell: bash
        run: |
          set -euo pipefail

          BIN="$(find output/target -type f \
            -name vsftpd -path '*/sbin/*' -print -quit)"

          if [ -z "$BIN" ]; then
            echo "::error::vsftpd executable not found."
            find output/target -iname '*vsftpd*' -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          install -m 755 "$BIN" "$GITHUB_WORKSPACE/dist/vsftpd"

          {
            echo "=== Binary format ==="
            file "$GITHUB_WORKSPACE/dist/vsftpd"

            echo
            echo "=== ELF header ==="
            readelf -h "$GITHUB_WORKSPACE/dist/vsftpd" || true

            echo
            echo "=== Program interpreter ==="
            readelf -l "$GITHUB_WORKSPACE/dist/vsftpd" \
              | grep -E 'INTERP|Requesting program interpreter' || true

            echo
            echo "=== Shared library requirements ==="
            readelf -d "$GITHUB_WORKSPACE/dist/vsftpd" \
              | grep NEEDED || true

            echo
            echo "=== File size ==="
            ls -lh "$GITHUB_WORKSPACE/dist/vsftpd"
          } > "$GITHUB_WORKSPACE/dist/diagnostics.txt" 2>&1

          cat "$GITHUB_WORKSPACE/dist/diagnostics.txt"

          cat > "$GITHUB_WORKSPACE/dist/README.txt" <<'EOF'
          Target: MIPS little-endian.
          Build: Buildroot dynamically linked configuration.

          This is a diagnostic build, not a confirmed JCO4032-compatible
          executable. The router uses an older uClibc runtime. Check the
          ELF architecture, interpreter and required libraries before
          attempting to execute the binary on the router.
          EOF

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsftpd-jco4032-mipsel
          path: dist/
          if-no-files-found: error
          retention-days: 7
