
name: Build JF-vsftpd for JF-mips32r2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Cross-compile vsftpd for MIPS32r2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download vsftpd 3.0.5
        run: |
          wget -O vsftpd.tar.gz \
            https://security.appspot.com/downloads/vsftpd-3.0.5.tar.gz

          echo "26b602ae454b0ba6d99ef44a09b6b9e0dfa7f67228106736df1f278c70bc91d3  vsftpd.tar.gz" | sha256sum -c -

          tar -xzf vsftpd.tar.gz
          rm vsftpd.tar.gz

      - name: Download JF MIPS32r2 toolchain
        run: |
          wget -O toolchain.tar \
            https://github.com/JFC-Group/JF-Buildroot/releases/download/2015.08.1/mipsel-buildroot-linux-uclibc-toolchain-2015.08.1.tar

          tar -xf toolchain.tar
          rm toolchain.tar

      - name: Set environment variables
        run: |
          TOOLCHAIN="$(pwd)/mipsel-buildroot-linux-uclibc-toolchain-2015.08.1"

          echo "$TOOLCHAIN/usr/bin" >> "$GITHUB_PATH"

          echo "LD_LIBRARY_PATH=$TOOLCHAIN/usr/lib" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=$TOOLCHAIN/usr/bin/mipsel-buildroot-linux-uclibc-" >> "$GITHUB_ENV"

          echo "CC=$TOOLCHAIN/usr/bin/mipsel-buildroot-linux-uclibc-gcc" >> "$GITHUB_ENV"

      - name: Configure vsftpd
        working-directory: vsftpd-3.0.5
        run: |
          # Disable PAM and TCP wrappers.
          sed -i 's/#define VSF_BUILD_PAM/#undef VSF_BUILD_PAM/' builddefs.h
          sed -i 's/#define VSF_BUILD_TCPWRAPPERS/#undef VSF_BUILD_TCPWRAPPERS/' builddefs.h

          # Disable SSL for a standalone build without OpenSSL dependency.
          sed -i 's/#define VSF_BUILD_SSL/#undef VSF_BUILD_SSL/' builddefs.h

      - name: Build vsftpd
        working-directory: vsftpd-3.0.5
        run: |
          make clean

          make -j$(nproc) \
            CC="$CC" \
            CFLAGS="-O2 -D_GNU_SOURCE -D_LARGEFILE64_SOURCE -include fcntl.h -fno-strict-aliasing" \
            LDFLAGS="-Wl,-z,relro -Wl,-z,now" \
            LIBS="-lcrypt -lnsl" \
            LINK="-Wl,-s" \
            vsftpd

      - name: Verify binary
        working-directory: vsftpd-3.0.5
        run: |
          file vsftpd

          ${CROSS_COMPILE}readelf -h vsftpd

          ${CROSS_COMPILE}readelf -l vsftpd || true

          ${CROSS_COMPILE}readelf -d vsftpd || true

          mkdir -p ../release
          cp vsftpd ../release/vsftpd-jiofiber-mips32r2

      - name: Generate release tag
        id: tag
        run: |
          TAG_NAME="vsftpd-$(date +%Y%m%d-%H%M%S)"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create Release and Upload Binary
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/vsftpd-jiofiber-mips32r2
          name: JF-vsftpd 3.0.5
          tag_name: ${{ steps.tag.outputs.tag_name }}
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
