
name: Build vsftpd for JioFiber JCO4032

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ make \
            git wget cpio rsync bc file \
            unzip python3 perl \
            libncurses-dev

      - name: Download Buildroot
        run: |
          git clone --depth 1 \
            https://github.com/buildroot/buildroot.git buildroot

      - name: Select MIPS little-endian configuration
        working-directory: buildroot
        shell: bash
        run: |
          set -euo pipefail

          find configs -maxdepth 1 -type f \
            -iname '*mips*' -printf '%f\n' | sort

          CONFIG=""

          for candidate in \
            qemu_mips32r2el_malta_defconfig \
            qemu_mipsel_malta_defconfig \
            qemu_mips32el_malta_defconfig
          do
            if [ -f "configs/$candidate" ]; then
              CONFIG="$candidate"
              break
            fi
          done

          if [ -z "$CONFIG" ]; then
            echo "::error::No supported MIPS little-endian configuration found."
            exit 1
          fi

          echo "Using $CONFIG"
          make "$CONFIG"

      - name: Configure static toolchain and vsftpd
        working-directory: buildroot
        shell: bash
        run: |
          set -euo pipefail

          test -f package/vsftpd/vsftpd.mk || {
            echo "::error::Buildroot vsftpd package not found."
            exit 1
          }

          test -x utils/config || {
            echo "::error::Buildroot configuration utility not found."
            exit 1
          }

          # Select static libraries using Buildroot's Kconfig utility.
          utils/config --file .config --enable BR2_STATIC_LIBS
          utils/config --file .config --enable BR2_PACKAGE_VSFTPD
          utils/config --file .config --enable BR2_TARGET_ROOTFS_TAR

          make olddefconfig

          echo "=== Effective settings ==="
          grep -E \
            '^(BR2_STATIC_LIBS|BR2_SHARED_LIBS|BR2_PACKAGE_VSFTPD|BR2_TARGET_ROOTFS_TAR)=|^# BR2_(STATIC|SHARED)_LIBS is not set' \
            .config || true

          if ! grep -qx 'BR2_PACKAGE_VSFTPD=y' .config; then
            echo "::error::vsftpd is not enabled."
            exit 1
          fi

          if ! grep -qx 'BR2_STATIC_LIBS=y' .config; then
            echo "::error::Static linking is unavailable or was rejected by this toolchain."
            exit 1
          fi

      - name: Compile
        working-directory: buildroot
        run: |
          set -euo pipefail
          make -j"$(nproc)"

      - name: Locate and verify binary
        working-directory: buildroot
        shell: bash
        run: |
          set -euo pipefail

          BIN="$(find output/target -type f \
            \( -name vsftpd -o -name 'vsftpd*' \) \
            -path '*/sbin/*' -print -quit)"

          if [ -z "$BIN" ]; then
            echo "::error::vsftpd executable not found."
            find output/target -iname '*vsftpd*' -print || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          install -m 755 "$BIN" "$GITHUB_WORKSPACE/dist/vsftpd"

          file "$GITHUB_WORKSPACE/dist/vsftpd"

          if readelf -l "$GITHUB_WORKSPACE/dist/vsftpd" \
            | grep -q 'INTERP'; then
            echo "::warning::Binary uses a dynamic interpreter."
          else
            echo "No dynamic interpreter detected."
          fi

          cat > "$GITHUB_WORKSPACE/dist/README.txt" <<'EOF'
          Target: MIPS little-endian
          Purpose: FTP server testing on a compatible router.

          Compatibility with the JCO4032 CPU ABI, kernel and uClibc
          version is not guaranteed. Test architecture and runtime
          compatibility before deployment. Do not expose FTP to the
          public internet without appropriate security controls.
          EOF

          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsftpd-jco4032-mipsel
          path: dist/
          if-no-files-found: error
          retention-days: 7
