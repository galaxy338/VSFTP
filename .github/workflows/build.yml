
name: Build vsftpd for JCO4032 (MIPS uClibc)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential wget bzip2 tar \
            file binutils python3

      - name: Download MIPS uClibc toolchain
        run: |
          set -euo pipefail

          wget -O toolchain.tar.bz2 \
            https://toolchains.bootlin.com/downloads/releases/toolchains/mips32el/tarballs/mips32el--uclibc--stable-2020.02-2.tar.bz2

          mkdir toolchain
          tar -xjf toolchain.tar.bz2 -C toolchain

          GCC="$(find "$PWD/toolchain" -type f \
            -name '*-gcc' -print -quit)"

          if [ -z "$GCC" ]; then
            echo "::error::Cross compiler not found."
            exit 1
          fi

          echo "CROSS_GCC=$GCC" >> "$GITHUB_ENV"
          echo "Compiler: $GCC"
          "$GCC" --version

      - name: Download vsftpd source
        run: |
          set -euo pipefail

          wget -O vsftpd.tar.gz \
            https://security.appspot.com/downloads/vsftpd-3.0.5.tar.gz

          tar -xzf vsftpd.tar.gz
          test -d vsftpd-3.0.5

      - name: Compile vsftpd
        working-directory: vsftpd-3.0.5
        shell: bash
        run: |
          set -euo pipefail

          CC="$CROSS_GCC"

          echo "=== Compiler target ==="
          "$CC" -dumpmachine

          echo "=== Compiler configuration ==="
          "$CC" -print-sysroot

          # Build for the router's 32-bit MIPS little-endian architecture.
          # Override the dynamic loader to match the JCO4032.
          make clean || true

          make -j2 \
            CC="$CC" \
            LINK="$CC" \
            CFLAGS="-O2 -Wall -fPIE -D_FORTIFY_SOURCE=2" \
            LDFLAGS="-pie -Wl,--dynamic-linker=/lib/ld-uClibc.so.0"

          test -f vsftpd

      - name: Verify binary
        run: |
          set -euo pipefail

          mkdir -p dist
          install -m 755 vsftpd-3.0.5/vsftpd dist/vsftpd

          {
            echo "=== File format ==="
            file dist/vsftpd

            echo
            echo "=== ELF header ==="
            readelf -h dist/vsftpd

            echo
            echo "=== Interpreter ==="
            readelf -l dist/vsftpd \
              | grep -E 'INTERP|Requesting program interpreter' || true

            echo
            echo "=== Shared libraries ==="
            readelf -d dist/vsftpd | grep NEEDED || true

            echo
            echo "=== Size ==="
            ls -lh dist/vsftpd
          } > dist/diagnostics.txt 2>&1

          cat dist/diagnostics.txt

          if readelf -h dist/vsftpd | grep -q 'little endian'; then
            echo "ELF endian check passed."
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsftpd-jco4032-uclibc
          path: dist/
          retention-days: 7
          if-no-files-found: error
