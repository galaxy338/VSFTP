
name: Build Samba for JCO4032

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            cpio \
            file \
            rsync \
            wget \
            curl \
            unzip \
            python3 \
            python3-dev \
            python3-venv \
            libncurses-dev \
            patchelf \
            xz-utils

      - name: Download Buildroot
        run: |
          git clone --depth 1 --branch 2026.08 \
            https://github.com/buildroot/buildroot.git
          cd buildroot

      - name: Configure MIPS32r2 uClibc toolchain
        working-directory: buildroot
        run: |
          cat > jco4032_defconfig <<'EOF'
          BR2_mipsel=y
          BR2_mips_32r2=y
          BR2_MIPS_OABI32=y
          BR2_MIPS_SOFT_FLOAT=y

          BR2_TOOLCHAIN_BUILDROOT_UCLIBC=y
          BR2_TOOLCHAIN_BUILDROOT_WCHAR=y
          BR2_PTHREADS_NATIVE=y
          BR2_SHARED_LIBS=y

          BR2_USE_MMU=y
          BR2_TOOLCHAIN_BUILDROOT_LOCALE=y

          BR2_PACKAGE_SAMBA4=y
          # BR2_PACKAGE_SAMBA4_AD_DC is not set
          # BR2_PACKAGE_SAMBA4_ADS is not set
          # BR2_PACKAGE_SAMBA4_SMBTORTURE is not set

          BR2_TARGET_ROOTFS_TAR=y
          EOF

          make defconfig BR2_DEFCONFIG=jco4032_defconfig
          make olddefconfig

          echo "===== Selected configuration ====="
          grep -E \
            'BR2_(mipsel|mips_32r2|MIPS_OABI32|MIPS_SOFT_FLOAT|TOOLCHAIN_BUILDROOT_UCLIBC|PTHREADS_NATIVE|SHARED_LIBS|PACKAGE_SAMBA4)' \
            .config

      - name: Build Samba and dependencies
        working-directory: buildroot
        run: |
          make -j2
        env:
          FORCE_UNSAFE_CONFIGURE: 1

      - name: Stage Samba runtime
        working-directory: buildroot
        run: |
          set -eux

          TARGET="$PWD/output/target"
          STAGE="$PWD/samba-jco4032"

          mkdir -p "$STAGE"

          test -x "$TARGET/usr/sbin/smbd"

          cp -a "$TARGET/lib" "$STAGE/"
          cp -a "$TARGET/usr/lib" "$STAGE/usr-lib"

          mkdir -p "$STAGE/sbin" "$STAGE/etc" "$STAGE/var"

          cp "$TARGET/usr/sbin/smbd" "$STAGE/sbin/"

          if [ -d "$TARGET/usr/lib/samba" ]; then
            mkdir -p "$STAGE/usr/lib"
            cp -a "$TARGET/usr/lib/samba" "$STAGE/usr/lib/"
          fi

          cat > "$STAGE/etc/smb.conf" <<'EOF'
          [global]
          workgroup = WORKGROUP
          server string = JCO4032 NAS
          security = user
          map to guest = never
          server min protocol = SMB2
          server max protocol = SMB3
          smb ports = 445
          passdb backend = tdbsam
          private dir = /flash2/samba/private
          state directory = /flash2/samba/state
          cache directory = /flash2/samba/cache
          lock directory = /flash2/samba/lock
          pid directory = /flash2/samba/run
          log file = /flash2/samba/log/%m.log
          logging = file
          load printers = no
          disable spoolss = yes

          [Crucial]
          path = /tmp/mnt/nas/sda2
          browseable = yes
          read only = no
          valid users = nasuser
          create mask = 0664
          directory mask = 0775
          EOF

          echo "===== Binary information ====="
          file "$STAGE/sbin/smbd"

          echo "===== Dynamic dependencies ====="
          readelf -l "$STAGE/sbin/smbd" | grep interpreter || true
          readelf -d "$STAGE/sbin/smbd" | grep NEEDED || true

          tar -czf samba-jco4032.tar.gz samba-jco4032

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: samba-jco4032
          path: buildroot/samba-jco4032.tar.gz
          retention-days: 14
